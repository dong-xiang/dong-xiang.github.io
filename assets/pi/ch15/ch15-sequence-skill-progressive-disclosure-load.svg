.9287,356.1484,115.9287,360.1484,125.9287,364.1484,121.9287,360.1484" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;stroke-dasharray:2,2;" x1="119.9287" x2="322.0938" y1="360.1484" y2="360.1484"/><text fill="#000000" font-family="monospace" font-size="10" lengthAdjust="spacing" textLength="184.165" x="131.9287" y="356.0391">assistant&#160;response&#160;(follows&#160;skill&#160;rules)</text></g><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="496.123" x="18.4067" y="387.0371"/><line style="stroke:#000000;stroke-width:1;" x1="18.4067" x2="514.5298" y1="387.0371" y2="387.0371"/><line style="stroke:#000000;stroke-width:1;" x1="18.4067" x2="514.5298" y1="390.0371" y2="390.0371"/><rect fill="#EEEEEE" height="19.7773" style="stroke:#000000;stroke-width:2;" width="287.0762" x="122.9302" y="378.1484"/><text fill="#000000" font-family="monospace" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="269.7803" x="128.9302" y="391.8164">Next&#160;turn:&#160;skill&#160;body&#160;is&#160;gone&#160;unless&#160;model&#160;reloads&#160;it</text><path d="M82.4067,412.9258 L82.4067,480.9258 L507.4067,480.9258 L507.4067,422.9258 L497.4067,412.9258 L82.4067,412.9258" fill="#FFFFF0" style="stroke:#AAAAAA;stroke-width:0.5;"/><path d="M497.4067,412.9258 L497.4067,422.9258 L507.4067,422.9258 L497.4067,412.9258" fill="#FFFFF0" style="stroke:#AAAAAA;stroke-width:0.5;"/><text fill="#000000" font-family="monospace" font-size="10" lengthAdjust="spacing" textLength="249.2578" x="154.2681" y="427.5938">After&#160;agent_settled,&#160;the&#160;toolResult&#160;for&#160;the&#160;skill&#160;read</text><text fill="#000000" font-family="monospace" font-size="10" lengthAdjust="spacing" textLength="237.5391" x="154.2681" y="439.3711">is&#160;still&#160;in&#160;the&#160;transcript.&#160;On&#160;the&#160;next&#160;fresh&#160;turn,&#160;it</text><text fill="#000000" font-family="monospace" font-size="10" lengthAdjust="spacing" te