="194.8789" y="243.8643">to&#160;access&#160;local&#160;project?</text><text fill="#000000" font-family="monospace" font-size="11" lengthAdjust="spacing" textLength="17.4829" x="165.396" y="230.9092">yes</text><text fill="#000000" font-family="monospace" font-size="11" lengthAdjust="spacing" textLength="13.5835" x="329.748" y="230.9092">no</text><rect fill="#FAFAFA" height="76.5313" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="237.9277" x="19.1934" y="256.1846"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="102.5918" x="29.1934" y="277.7861">Gondolin&#160;pattern:</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="217.9277" x="29.1934" y="291.9189">replace&#160;BashOperations&#160;via&#160;extension</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="115.1426" x="29.1934" y="306.0518">bash&#160;-&gt;&#160;remote&#160;VM</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="119.0449" x="29.1934" y="320.1846">read/write&#160;stay&#160;local</text><ellipse cx="138.1572" cy="363.7158" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="138.1572" cy="363.7158" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#FAFAFA" height="76.5313" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="194.6973" x="277.1211" y="256.1846"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="90.9082" x="287.1211" y="277.7861">Docker&#160;pattern:</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="144.2871" x="287.1211" y="291.9189">run&#160;entire&#160;Pi&#160;in&#160;container</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="166.5117" x="287.1211" y="306.0518">mount&#160;only&#160;project&#160;directory</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="174.6973" x="287.1211" y="320.1846">--network&#160;none&#160;for&#160;no&#160;egress</text><ellipse cx="374.4697" cy="363.7158" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="374.4697" cy="363.7158" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#FFF9E6" points="194.6614,169.8867,317.9656,169.8867,329.9656,182.8418,317.9656,195.7969,194.6614,195.7969,182.6614,182.8418,194.6614,169.8867" style="stroke:#999900;stroke-width:0.5;"/><text fill="#000000" font-family="monospace" font-size="11" lengthAdjust="spacing" textLength="17.4829" x="260.3135" y="206.4316">yes</text><text fill="#000000" font-family="monospace" font-size="11" lengthAdjust="spacing" textLength="123.3042" x="194.6614" y="180.5215">must&#160;isolate&#160;bash&#160;from</text><text fill="#000000" font-family="monospace" font-size="11" lengthAdjust="spacing" textLength="113.7383" x="194.6614" y="193.4766">local&#160;host&#160;filesystem?</text><text fill="#000000" font-family="monospace" font-size="11" lengthAdjust="spacing" textLength="13.5835" x="329.9656" y="180.5215">no</text><rect fill="#FAFAFA" height="76.5313" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="196.9648" x="157.8311" y="467.1035"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="80.4316" x="167.8311" y="488.7051">Syscall&#160;policy:</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="176.9648" x="167.8311" y="502.8379">seccomp&#160;/&#160;OpenShell&#160;/&#160;pledge</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="141.2051" x="167.8311" y="516.9707">allowlist:&#160;git,&#160;npm,&#160;node</text><text fill="#000000" font-family="monospace" font-size="12" l